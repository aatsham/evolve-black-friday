  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Shop EVOLVE's Black Friday offers on Level 3 memberships.">
  <title>EVOLVE | Black Friday Sale</title>
  <style>
    :root { color-scheme: dark; --blue: #003cf8; --text: #fff; --muted: #c7cbd4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #050505; color: var(--text); font: 16px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 1080px; margin: auto; padding: clamp(16px, 5vw, 56px); }
    header { border-top: 6px solid var(--blue); padding: clamp(20px, 5vw, 44px) 0 18px; }
    header img { display: block; width: clamp(140px, 25vw, 220px); height: auto; }
    h1, strong { font-family: "DIN Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 900; line-height: .98; }
    h1 { margin: 26px 0 0; font-size: clamp(40px, 8vw, 100px); letter-spacing: -.055em; text-transform: uppercase; }
    ul { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 12px 0 0; padding: 0; list-style: none; }
    li { display: flex; }
    a { display: grid; flex: 1; align-content: start; gap: 18px; padding: clamp(16px, 3vw, 28px); border: 1px solid #373a44; border-radius: 12px; background: #13141a; color: inherit; text-decoration: none; }
    a:hover { border-color: #819bff; background: #1c2032; }
    a:focus-visible { outline: 3px solid #9eafff; outline-offset: 3px; }
    a > span:first-child { color: var(--muted); font-weight: 700; text-transform: uppercase; }
    strong { font-size: clamp(34px, 5vw, 66px); letter-spacing: -.045em; }
    .action { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 12px; background: var(--blue); border-radius: 6px; font-weight: 700; }
    @media (max-width: 700px) {
      ul { grid-template-columns: 1fr; }
      a { gap: 12px; }
      strong { font-size: clamp(40px, 9vw, 56px); }
    }
  </style>
